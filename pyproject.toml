[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "divtel"
description = "Divergent pointing mode for Imaging Atmospheric Cherenkov Telescopes arrays"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["version"]

authors = [
    { name = "Thomas Vuillaume", email = "thomas.vuillaume@lapp.in2p3.fr" },
    { name = "Alice Donini", email = "alice.donini@inaf.it" },
    { name = "Thomas Gasparetto" },
]
maintainers = [
    { name = "Thomas Vuillaume", email = "thomas.vuillaume@lapp.in2p3.fr" },
]

keywords = [
    "astronomy",
    "astrophysics",
    "cherenkov",
    "cta",
    "iact",
    "divergent-pointing",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "astropy>=5.0",
    "matplotlib>=3.6",
    "numpy>=1.23",
    # Polygon arithmetic for the hyper field of view: the overlapping camera
    # footprints are cut into patches and their areas summed.
    "shapely>=2.0",
]

# Consumer-facing optional feature: published in the wheel metadata, so
# `pip install divtel[examples]` works for users of the released package.
[project.optional-dependencies]
examples = [
    "ipympl>=0.9",
    "ipywidgets>=8.0",
    "jupyterlab>=4.0",
]

# Development-only dependencies (PEP 735). These are deliberately *not*
# published in the wheel metadata -- they are for working on divtel, not for
# using it. `uv sync` installs the "dev" group by default.
[dependency-groups]
tests = [
    "pytest>=7.0",
]
docs = [
    "myst-parser>=2.0",
    "sphinx>=7.0",
    "sphinx-argparse>=0.4",
    "furo>=2024.1",
    "pygments>=2.20",
    # Exports the interactive demo to WebAssembly so it stays live on GitHub
    # Pages, which can only serve static files. Shells out to uv.
    "marimo>=0.14",
    "uv>=0.5",
]
dev = [
    {include-group = "tests"},
    {include-group = "docs"},
    "build>=1.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/cta-observatory/divtel"
Documentation = "https://cta-observatory.github.io/divtel/"
Repository = "https://github.com/cta-observatory/divtel.git"
Issues = "https://github.com/cta-observatory/divtel/issues"

[tool.setuptools.packages.find]
include = ["divtel*"]

[tool.setuptools.package-data]
divtel = ["data/*.ecsv"]

[tool.setuptools_scm]
version_file = "divtel/_version.py"

[tool.pytest.ini_options]
testpaths = ["divtel"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
