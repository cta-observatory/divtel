name: Sphinx docs to gh-pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sphinx_docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: Sphinx docs to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm needs tags to derive the version, which ends up in
          # the wheel filename the exported notebook installs.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          pip install ".[examples]" --group docs

      - name: Build docs
        # conf.py executes the notebooks, then exports the marimo notebook to
        # WebAssembly and builds a divtel wheel for it, so the build needs the
        # package and the docs group installed in *this* environment.
        run: sphinx-build -b html docs docs/_build/html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
